# Builds the desktop app for Windows, Mac and Linux.
# Run it from the repository's Actions tab (Desktop app → Run workflow), or
# push a tag like desktop-v1.0.0. The installers appear under "Artifacts"
# on the finished run.
name: Desktop app

on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # unsigned builds (no code-signing certificate)
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-editor-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
          if-no-files-found: error

  # Also publishes the two portable Windows apps (PDF Editor and PDF Editor
  # Lite) as a GitHub Release named after the app version (desktop-v1.2.0),
  # so they have permanent download links.
  release-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: PDF Editor (portable)
        run: npm run prepare-app && npx electron-builder --win portable --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: PDF Editor Lite (portable)
        run: >
          npm run prepare-app:lite && npx electron-builder --win portable --publish never
          -c.productName="PDF Editor Lite" -c.appId=com.pdfeditor.lite
          -c.extraMetadata.name=pdf-editor-lite -c.extraMetadata.productName="PDF Editor Lite"
          -c.portable.artifactName='PDF-Editor-Lite-Portable-${version}.exe'
          -c.portable.splashImage=build/splash-lite.bmp
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: PDF Editor ${{ steps.v.outputs.version }}
          body: |
            Portable Windows apps: download, then double-click to run (nothing to install).
            - **PDF-Editor-Portable** – the full app, with text recognition (OCR).
            - **PDF-Editor-Lite-Portable** – the same app without text recognition.

            Windows may say "Windows protected your PC" because the app isn't signed: click **More info → Run anyway**.
          files: |
            desktop/dist/PDF-Editor-Portable-*.exe
            desktop/dist/PDF-Editor-Lite-Portable-*.exe
          fail_on_unmatched_files: true
